onboarding = false

[keys]
# tmux prefix C-a. Pressing it twice sends a literal C-a (built into Herdr),
# which replaces tmux's `bind C-a send-prefix`.
prefix = "ctrl+a"

# Splits: tmux `-` = split-window -v (stacked), `|` = split-window -h (side by side)
split_horizontal = "prefix+minus"
split_vertical = "prefix+|"

# Pane focus: same h/j/k/l as tmux
focus_pane_left = "prefix+h"
focus_pane_down = "prefix+j"
focus_pane_up = "prefix+k"
focus_pane_right = "prefix+l"

# Previous/next tab (Herdr's equivalent of a tmux window)
previous_tab = "prefix+ctrl+h"
next_tab = "prefix+ctrl+l"

# Pane resize: tmux H/J/K/L. Herdr binds these keys to swap_pane_* by default,
# so free them here to avoid a conflict.
resize_pane_left = "prefix+shift+h"
resize_pane_down = "prefix+shift+j"
resize_pane_up = "prefix+shift+k"
resize_pane_right = "prefix+shift+l"
swap_pane_left = ""
swap_pane_down = ""
swap_pane_up = ""
swap_pane_right = ""

[ui.toast]
delivery = "system"

[theme]
name = "catppuccin"
auto_switch = false

[ui]
status_indicators = "dots"
